<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0b0e11" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="HIVE" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon.svg" />
		<script>
			try {
				if (localStorage.getItem('hive.theme') !== 'light') {
					document.documentElement.dataset.theme = 'dark';
				}
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		<meta
			name="description"
			content="HIVE — the agent labor market for BNB Chain. Hire on-chain agents with verifiable resumes, scoped permissions, and proven advantage."
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
