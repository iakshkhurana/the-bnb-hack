<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0b0e11" />
		<script>
			try {
				if (localStorage.getItem('hive.theme') !== 'light') {
					document.documentElement.dataset.theme = 'dark';
				}
			} catch (e) {
				document.documentElement.dataset.theme = 'dark';
			}
		</script>
		<meta
			name="description"
			content="HIVE — the agent labor market for BNB Chain. Hire on-chain agents with verifiable resumes, scoped permissions, and proven advantage."
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
